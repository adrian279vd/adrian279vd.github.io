name: One-time public site audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/public-site-audit.yml"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check published pages and outbound links
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          urls=[
            'https://adrian279vd.github.io/',
            'https://adrian279vd.github.io/research.html',
            'https://adrian279vd.github.io/cv.html',
            'https://adrian279vd.github.io/files/Adrian_Vidal_Short_CV.pdf',
            'https://adrian279vd.github.io/files/Adrian_Vidal_Full_CV.pdf',
            'https://adrian279vd.github.io/social-preview.png',
            'https://adrian279vd.github.io/robots.txt',
            'https://adrian279vd.github.io/sitemap.xml',
            'https://doi.org/10.1007/s00365-026-09789-w',
            'https://doi.org/10.1007/s00023-025-01564-0',
            'https://arxiv.org/abs/2501.17710',
            'https://orcid.org/0009-0002-2338-5591',
            'https://scholar.google.com/citations?user=HVv9miEAAAAJ',
            'https://github.com/adrian279vd',
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (academic-site-audit)'})
              with urllib.request.urlopen(req,timeout=20) as res:
                print('URLCHECK',res.status,res.geturl(),url,flush=True)
            except urllib.error.HTTPError as e:
              print('URLCHECK_HTTP',e.code,url,flush=True)
            except Exception as e:
              print('URLCHECK_ERROR',url,type(e).__name__,str(e)[:100],flush=True)
          PY
      - name: Install Lighthouse
        run: npm install --no-save lighthouse@12.8.2
      - name: Lighthouse mobile
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npx lighthouse https://adrian279vd.github.io/ --output=json --output-path=lh-mobile.json --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
      - name: Lighthouse desktop
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npx lighthouse https://adrian279vd.github.io/ --preset=desktop --output=json --output-path=lh-desktop.json --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
      - name: Print audit scores and failures
        run: |
          node - <<'JS'
          const fs=require('fs');
          for(const mode of ['mobile','desktop']){
            let j=JSON.parse(fs.readFileSync('lh-'+mode+'.json'));
            let scores=Object.fromEntries(Object.entries(j.categories).map(([k,v])=>[k,Math.round((v.score||0)*100)]));
            let metrics=Object.fromEntries(['first-contentful-paint','largest-contentful-paint','cumulative-layout-shift','total-blocking-time'].map(k=>[k,j.audits[k]?.displayValue]));
            let failures=Object.values(j.audits).filter(a=>a.score!==null&&a.score<.9&&['binary','numeric'].includes(a.scoreDisplayMode)).slice(0,12).map(a=>({id:a.id,score:a.score,title:a.title}));
            console.log('LIGHTHOUSE_RESULT',JSON.stringify({mode,url:j.finalDisplayedUrl,scores,metrics,failures}));
          }
          JS
